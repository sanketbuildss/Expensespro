<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpensePro | Login</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: #050509; color: #fff; overflow: hidden; }
        
        .bg-glow { position: absolute; width: 300px; height: 300px; background: linear-gradient(135deg, #6366f1, #a855f7); filter: blur(120px); opacity: 0.3; z-index: -1; border-radius: 50%; }
        
        .auth-container { width: 100%; max-width: 400px; padding: 35px; background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.5); animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area h1 { font-size: 28px; font-weight: 800; background: linear-gradient(135deg, #818cf8, #e879f9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-area p { color: #94a3b8; font-size: 13px; margin-top: 5px; }

        .input-box { position: relative; margin-bottom: 20px; }
        .input-box input { width: 100%; padding: 15px 18px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; color: #fff; font-size: 14px; outline: none; transition: 0.3s; }
        .input-box input:focus { border-color: #6366f1; background: rgba(99, 102, 241, 0.05); }
        .input-box label { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 14px; pointer-events: none; transition: 0.2s; }
        .input-box input:focus ~ label, .input-box input:not(:placeholder-shown) ~ label { top: 0; left: 12px; font-size: 11px; background: #050509; padding: 0 5px; color: #818cf8; font-weight: 600; }

        .btn-main { width: 100%; padding: 15px; background: linear-gradient(135deg, #6366f1, #a855f7); border: none; border-radius: 14px; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3); }
        .btn-main:hover { opacity: 0.9; transform: translateY(-1px); }

        .footer-text { text-align: center; margin-top: 22px; font-size: 13px; color: #94a3b8; }
        .footer-text a { color: #818cf8; text-decoration: none; font-weight: 600; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="auth-container">
        <div class="logo-area">
            <h1>ExpensePro</h1>
            <p>Smart Finance Tracker</p>
        </div>

        <div id="loginBlock">
            <div class="input-box">
                <input type="email" id="loginEmail" placeholder=" " required>
                <label>Email Address</label>
            </div>
            <div class="input-box">
                <input type="password" id="loginPass" placeholder=" " required>
                <label>Password</label>
            </div>
            <button class="btn-main" onclick="handleLogin()">Login</button>
            <div class="footer-text">New here? <a href="#" id="toSignup">Create Account</a></div>
        </div>

        <div id="signupBlock" class="hidden">
            <div class="input-box">
                <input type="text" id="userName" placeholder=" " required>
                <label>Full Name</label>
            </div>
            <div class="input-box">
                <input type="email" id="signupEmail" placeholder=" " required>
                <label>Email Address</label>
            </div>
            <div class="input-box">
                <input type="password" id="signupPass" placeholder=" " required>
                <label>Password</label>
            </div>
            <button class="btn-main" onclick="handleSignup()">Sign Up</button>
            <div class="footer-text">Already registered? <a href="#" id="toLogin">Login here</a></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuAk4SC_u75__SMqKu50r5bVdga8xcSZY",
            authDomain: "expensespro.firebaseapp.com",
            projectId: "expensespro",
            storageBucket: "expensespro.firebasestorage.app",
            messagingSenderId: "117225436411",
            appId: "1:117225436411:web:db2359d4c642ceec46ac5e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const toSignup = document.getElementById('toSignup');
        const toLogin = document.getElementById('toLogin');
        const loginBlock = document.getElementById('loginBlock');
        const signupBlock = document.getElementById('signupBlock');

        toSignup.addEventListener('click', (e) => { e.preventDefault(); loginBlock.classList.add('hidden'); signupBlock.classList.remove('hidden'); });
        toLogin.addEventListener('click', (e) => { e.preventDefault(); signupBlock.classList.add('hidden'); loginBlock.classList.remove('hidden'); });

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) { alert("Please fill all fields"); return; }
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => { window.location.href = "dashboard.html"; })
                .catch((err) => { alert("Login Failed: " + err.message); });
        }

        function handleSignup() {
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const pass = document.getElementById('signupPass').value;
            if(!name || !email || !pass) { alert("Please fill all fields"); return; }
            auth.createUserWithEmailAndPassword(email, pass)
                .then((res) => res.user.updateProfile({ displayName: name }))
                .then(() => { window.location.href = "dashboard.html"; })
                .catch((err) => { alert("Signup Failed: " + err.message); });
        }
    </script>
</body>
</html>
