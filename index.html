<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpensePro | Next-Gen Auth</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        body { height: 100vh; display: flex; justify-content: center; align-items: center; background: #030712; overflow: hidden; color: #f9fafb; }
        
        .mesh-bg { position: absolute; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.15) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%), #030712; }
        
        .auth-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 32px; padding: 48px 40px; width: 420px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); position: relative; animation: cardLoad 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes cardLoad { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        .brand-logo { text-align: center; margin-bottom: 36px; }
        .brand-logo h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .brand-logo p { color: #9ca3af; font-size: 14px; margin-top: 6px; font-weight: 400; }
        
        .input-group { position: relative; margin-bottom: 22px; }
        .input-group input { width: 100%; padding: 16px 20px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px; outline: none; color: white; font-size: 15px; transition: all 0.3s ease; }
        .input-group input:focus { border-color: #6366f1; background: rgba(99, 102, 241, 0.05); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }
        .input-group label { position: absolute; left: 20px; top: 50%; transform: translateY(-50%); color: #6b7280; font-size: 15px; pointer-events: none; transition: all 0.2s ease; }
        .input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label { top: 0; left: 14px; font-size: 12px; font-weight: 600; color: #818cf8; padding: 0 6px; background: #0b0f19; border-radius: 4px; }
        
        .btn-premium { width: 100%; padding: 16px; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); border: none; border-radius: 16px; color: white; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4); }
        .btn-premium:hover { transform: translateY(-2px); box-shadow: 0 15px 25px -5px rgba(99, 102, 241, 0.6); }
        
        .auth-footer { text-align: center; margin-top: 24px; font-size: 14px; color: #9ca3af; }
        .auth-footer a { color: #818cf8; text-decoration: none; font-weight: 600; }
        .auth-footer a:hover { text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="auth-card">
        <div class="brand-logo">
            <h1>ExpensePro</h1>
            <p>Smart & Custom Money Tracker</p>
        </div>

        <div id="loginBlock">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder=" " required>
                <label>Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" id="loginPass" placeholder=" " required>
                <label>Password</label>
            </div>
            <button class="btn-premium" onclick="handleLogin()">Secure Login</button>
            <div class="auth-footer">Don't have an account? <a href="#" id="toSignup">Sign Up Free</a></div>
        </div>

        <div id="signupBlock" class="hidden">
            <div class="input-group">
                <input type="text" id="userName" placeholder=" " required>
                <label>Full Name</label>
            </div>
            <div class="input-group">
                <input type="email" id="signupEmail" placeholder=" " required>
                <label>Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" id="signupPass" placeholder=" " required>
                <label>Create Password</label>
            </div>
            <button class="btn-premium" onclick="handleSignup()">Get Started</button>
            <div class="auth-footer">Already a member? <a href="#" id="toLogin">Log In</a></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuAk4SC_u75__SMqKu50r5bVdga8xcSZY",
            authDomain: "expensespro.firebaseapp.com",
            projectId: "expensespro",
            storageBucket: "expensespro.firebasestorage.app",
            messagingSenderId: "117225436411",
            appId: "1:117225436411:web:db2359d4c642ceec46ac5e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const toSignup = document.getElementById('toSignup');
        const toLogin = document.getElementById('toLogin');
        const loginBlock = document.getElementById('loginBlock');
        const signupBlock = document.getElementById('signupBlock');

        toSignup.addEventListener('click', (e) => { e.preventDefault(); loginBlock.classList.add('hidden'); signupBlock.classList.remove('hidden'); });
        toLogin.addEventListener('click', (e) => { e.preventDefault(); signupBlock.classList.add('hidden'); loginBlock.classList.remove('hidden'); });

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) { alert("Please fill all fields"); return; }
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => { window.location.href = "dashboard.html"; })
                .catch((err) => { alert("Login Failed: " + err.message); });
        }

        function handleSignup() {
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const pass = document.getElementById('signupPass').value;
            if(!name || !email || !pass) { alert("Please fill all fields"); return; }
            auth.createUserWithEmailAndPassword(email, pass)
                .then((res) => res.user.updateProfile({ displayName: name }))
                .then(() => { window.location.href = "dashboard.html"; })
                .catch((err) => { alert("Signup Failed: " + err.message); });
        }
    </script>
</body>
</html>
