<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpensePro | Next-Gen Finance</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-font-smoothing: antialiased; }
        
        body { 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: #060913; 
            overflow: hidden; 
            color: #f8fafc; 
        }

        /* Dynamic Animated Background Glows */
        .ambient-glow-1 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.25) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: -1;
            filter: blur(60px);
            animation: floatGlow 8s ease-in-out infinite alternate;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.2) 0%, rgba(0,0,0,0) 70%);
            bottom: -100px;
            right: -100px;
            z-index: -1;
            filter: blur(60px);
            animation: floatGlow 10s ease-in-out infinite alternate-reverse;
        }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 40px) scale(1.1); }
        }

        .auth-card { 
            background: rgba(15, 23, 42, 0.65); 
            backdrop-filter: blur(30px) saturate(200%); 
            -webkit-backdrop-filter: blur(30px) saturate(200%); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 36px; 
            padding: 48px 40px; 
            width: 430px; 
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.1); 
            position: relative; 
            animation: cardLoad 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; 
        }

        @keyframes cardLoad { 
            from { transform: translateY(20px); opacity: 0; } 
            to { transform: translateY(0); opacity: 1; } 
        }

        .brand-logo { text-align: center; margin-bottom: 36px; }
        .brand-logo h1 { 
            font-size: 32px; 
            font-weight: 800; 
            letter-spacing: -1px; 
            background: linear-gradient(135deg, #818cf8 0%, #ec4899 100%); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .brand-logo p { color: #94a3b8; font-size: 13px; margin-top: 6px; font-weight: 500; letter-spacing: 0.3px; }

        .input-group { position: relative; margin-bottom: 22px; }
        .input-group input { 
            width: 100%; 
            padding: 16px 20px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 16px; 
            outline: none; 
            color: white; 
            font-size: 15px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .input-group input:focus { 
            border-color: #6366f1; 
            background: rgba(99, 102, 241, 0.06); 
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); 
        }
        .input-group label { 
            position: absolute; 
            left: 20px; 
            top: 50%; 
            transform: translateY(-50%); 
            color: #64748b; 
            font-size: 14px; 
            pointer-events: none; 
            transition: all 0.2s ease; 
        }
        .input-group input:focus ~ label, .input-group input:not(:placeholder-shown) ~ label { 
            top: 0; 
            left: 16px; 
            font-size: 11px; 
            font-weight: 700; 
            color: #818cf8; 
            padding: 0 6px; 
            background: #0b0f19; 
            border-radius: 4px; 
        }

        .btn-premium { 
            width: 100%; 
            padding: 16px; 
            background: linear-gradient(135deg, #6366f1 0%, #ec4899 100%); 
            border: none; 
            border-radius: 16px; 
            color: white; 
            font-weight: 700; 
            font-size: 15px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4); 
            margin-top: 6px;
        }
        .btn-premium:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.6); 
        }
        .btn-premium:active { transform: translateY(0); }

        .auth-footer { text-align: center; margin-top: 26px; font-size: 13px; color: #94a3b8; }
        .auth-footer a { color: #818cf8; text-decoration: none; font-weight: 700; transition: color 0.2s; }
        .auth-footer a:hover { color: #ec4899; text-decoration: underline; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="auth-card">
        <div class="brand-logo">
            <h1>ExpensePro</h1>
            <p>Smart & Dynamic Finance Manager</p>
        </div>

        <div id="loginBlock">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder=" " required>
                <label>Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" id="loginPass" placeholder=" " required>
                <label>Password</label>
            </div>
            <button class="btn-premium" onclick="handleLogin()">Secure Login</button>
            <div class="auth-footer">Don't have an account? <a href="#" id="toSignup">Sign Up Free</a></div>
        </div>

        <div id="signupBlock" class="hidden">
            <div class="input-group">
                <input type="text" id="userName" placeholder=" " required>
                <label>Full Name</label>
            </div>
            <div class="input-group">
                <input type="email" id="signupEmail" placeholder=" " required>
                <label>Email Address</label>
            </div>
            <div class="input-group">
                <input type="password" id="signupPass" placeholder=" " required>
                <label>Create Password</label>
            </div>
            <button class="btn-premium" onclick="handleSignup()">Get Started</button>
            <div class="auth-footer">Already a member? <a href="#" id="toLogin">Log In</a></div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuAk4SC_u75__SMqKu50r5bVdga8xcSZY",
            authDomain: "expensespro.firebaseapp.com",
            projectId: "expensespro",
            storageBucket: "expensespro.firebasestorage.app",
            messagingSenderId: "117225436411",
            appId: "1:117225436411:web:db2359d4c642ceec46ac5e"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        const toSignup = document.getElementById('toSignup');
        const toLogin = document.getElementById('toLogin');
        const loginBlock = document.getElementById('loginBlock');
        const signupBlock = document.getElementById('signupBlock');

        toSignup.addEventListener('click', (e) => { e.preventDefault(); loginBlock.classList.add('hidden'); signupBlock.classList.remove('hidden'); });
        toLogin.addEventListener('click', (e) => { e.preventDefault(); signupBlock.classList.add('hidden'); loginBlock.classList.remove('hidden'); });

        function handleLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const pass = document.getElementById('loginPass').value;
            if(!email || !pass) { alert("Please fill all fields"); return; }
            auth.signInWithEmailAndPassword(email, pass)
                .then(() => { window.location.href = "dashboard.html"; })
                .catch((err) => { alert("Login Failed: " + err.message); });
        }

        function handleSignup() {
            const name = document.getElementById('userName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const pass = document.getElementById('signupPass').value;
            if(!name || !email || !pass) { alert("Please fill all fields"); return; }
            auth.createUserWithEmailAndPassword(email, pass)
                .then((res) => res.user.updateProfile({ displayName: name }))
                .then(() => { window.location.href = "dashboard.html"; })
                .catch((err) => { alert("Signup Failed: " + err.message); });
        }
    </script>
</body>
</html>
