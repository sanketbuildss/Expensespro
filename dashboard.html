<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpensePro | Dashboard</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root { 
            --bg: #060913; 
            --surface: #0f172a; 
            --surface-hover: #1e293b;
            --primary: #6366f1; 
            --accent: #ec4899;
            --income: #10b981; 
            --expense: #f43f5e; 
            --text-main: #f8fafc; 
            --text-dim: #94a3b8; 
            --border: rgba(255, 255, 255, 0.08); 
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text-main); 
            padding-bottom: 130px; 
            min-height: 100vh; 
            overflow-x: hidden; 
            background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.08) 0%, transparent 50%);
        }
        
        .page { display: none; padding: 28px 20px; animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); max-width: 540px; margin: 0 auto; }
        .page.active { display: block; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        .header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { 
            font-size: 26px; 
            font-weight: 800; 
            background: linear-gradient(to right, #fff, #94a3b8); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            letter-spacing: -0.5px;
        }
        
        /* Elite Balance Card */
        .balance-card { 
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 100%); 
            padding: 32px; 
            border-radius: 32px; 
            border: 1px solid rgba(99, 102, 241, 0.2); 
            text-align: center; 
            margin-bottom: 26px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15); 
            position: relative;
            overflow: hidden;
        }

        .balance-card::before {
            content: '';
            position: absolute;
            top: -50px; right: -50px;
            width: 150px; height: 150px;
            background: rgba(99, 102, 241, 0.2);
            filter: blur(40px);
            border-radius: 50%;
        }

        .balance-card span { color: #a5b4fc; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .balance-card h2 { font-size: 40px; font-weight: 800; margin-top: 8px; color: #fff; letter-spacing: -1px; }

        .section-title { font-size: 17px; font-weight: 700; margin-bottom: 14px; color: #f1f5f9; display: flex; align-items: center; justify-content: space-between; }
        
        /* Modern Transaction Item */
        .t-item { 
            background: var(--surface); 
            padding: 16px 18px; 
            border-radius: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            border: 1px solid var(--border); 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .t-item:hover { 
            background: var(--surface-hover); 
            transform: translateY(-2px); 
            border-color: rgba(99, 102, 241, 0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        
        .t-icon { 
            width: 48px; 
            height: 48px; 
            background: rgba(255, 255, 255, 0.04); 
            border-radius: 14px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 22px; 
            border: 1px solid rgba(255,255,255,0.04);
        }
        
        .action-btns { display: flex; gap: 8px; margin-left: 10px; }
        .action-btns button { 
            background: rgba(255, 255, 255, 0.05); 
            border: none; 
            width: 34px; 
            height: 34px; 
            border-radius: 10px; 
            cursor: pointer; 
            color: #fff; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: all 0.2s; 
            border: 1px solid rgba(255,255,255,0.03);
        }
        .action-btns button:hover { background: rgba(99, 102, 241, 0.2); border-color: rgba(99, 102, 241, 0.4); }

        /* Dynamic Glass Modal / Bottom Sheet */
        .modal-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(3, 6, 19, 0.85); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            display: none; 
            justify-content: center; 
            align-items: flex-end; 
            z-index: 1000; 
        }
        .modal-content { 
            background: #0b0f19; 
            width: 100%; 
            max-width: 500px; 
            padding: 32px 24px; 
            border-radius: 36px 36px 0 0; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            transform: translateY(100%); 
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
            max-height: 90vh; 
            overflow-y: auto; 
            box-shadow: 0 -30px 60px rgba(0,0,0,0.8);
        }
        .modal-overlay.open { display: flex; }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        
        .type-toggle { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 22px; 
            background: rgba(255, 255, 255, 0.03); 
            padding: 6px; 
            border-radius: 16px; 
            border: 1px solid var(--border);
        }
        .type-btn { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            color: var(--text-dim); 
            font-weight: 700; 
            font-size: 14px; 
            background: transparent; 
            transition: all 0.25s; 
        }
        .type-btn.active-ex { background: var(--expense); color: #fff; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.4); }
        .type-btn.active-in { background: var(--income); color: #fff; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }

        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
        .cat-btn { 
            background: rgba(255, 255, 255, 0.03); 
            padding: 12px 8px; 
            border-radius: 14px; 
            color: var(--text-dim); 
            cursor: pointer; 
            text-align: center; 
            border: 1.5px solid transparent; 
            font-size: 13px; 
            font-weight: 600; 
            transition: all 0.2s; 
        }
        .cat-btn.selected { 
            background: rgba(99, 102, 241, 0.15); 
            border-color: var(--primary); 
            color: #fff; 
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.2);
        }

        .custom-input-box { margin-top: 14px; }
        .custom-input-box label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .custom-input-box input { 
            width: 100%; 
            padding: 14px 16px; 
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid var(--border); 
            border-radius: 14px; 
            color: #fff; 
            font-size: 15px; 
            outline: none; 
            transition: border-color 0.2s; 
        }
        .custom-input-box input:focus { border-color: var(--primary); background: rgba(99,102,241,0.05); }

        .setting-card { 
            background: var(--surface); 
            padding: 18px 20px; 
            border-radius: 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            border: 1px solid var(--border); 
            font-weight: 600;
        }
        select { 
            background: #1e293b; 
            color: #fff; 
            border: 1px solid var(--border); 
            padding: 8px 14px; 
            border-radius: 12px; 
            outline: none; 
            font-weight: 700; 
        }

        /* Dynamic Floating Bottom Dock */
        .bottom-nav { 
            position: fixed; 
            bottom: 24px; 
            left: 50%; 
            transform: translateX(-50%); 
            width: 92%; 
            max-width: 420px; 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            justify-content: space-around; 
            align-items: center;
            padding: 10px 12px; 
            border-radius: 32px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            z-index: 500; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); 
        }
        .nav-item { 
            color: var(--text-dim); 
            border: none; 
            background: none; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            cursor: pointer; 
            font-size: 11px; 
            font-weight: 700; 
            transition: color 0.2s; 
        }
        .nav-item.active { color: #818cf8; text-shadow: 0 0 10px rgba(129, 140, 248, 0.5); }
        .nav-item span { font-size: 20px; margin-bottom: 2px; }
        
        .add-btn { 
            width: 56px; 
            height: 56px; 
            background: linear-gradient(135deg, #6366f1, #ec4899); 
            border-radius: 50%; 
            color: #fff; 
            font-size: 28px; 
            border: none; 
            transform: translateY(-22px); 
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.5), 0 0 15px rgba(236, 72, 153, 0.4); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        .add-btn:active { transform: translateY(-22px) scale(0.92); }
    </style>
</head>
<body>

    <!-- HOME PAGE -->
    <div id="home" class="page active">
        <header class="header">
            <div><p id="greet" style="color:var(--text-dim); font-size:13px; font-weight:700; text-transform: uppercase; letter-spacing: 0.5px;">Hello,</p><h1 id="userDisp">User!</h1></div>
        </header>
        <div class="balance-card">
            <span>Available Balance</span>
            <h2 id="mainBal">₹0</h2>
        </div>
        <div class="section-title">Recent History</div>
        <div id="transList"></div>
    </div>

    <!-- REPORTS PAGE -->
    <div id="reports" class="page">
        <header class="header"><h1>Analytics</h1></header>
        <div class="balance-card" style="padding: 20px;"><canvas id="statChart"></canvas></div>
        <div class="setting-card"><span>Total Income</span><h4 id="totIn" style="color:var(--income)">₹0</h4></div>
        <div class="setting-card"><span>Total Expense</span><h4 id="totEx" style="color:var(--expense)">₹0</h4></div>
    </div>

    <!-- SETTINGS PAGE -->
    <div id="settings" class="page">
        <header class="header"><h1>Settings</h1></header>
        <div class="setting-card"><span>Currency Preference</span><select id="currSel" onchange="updateCurrency()"><option value="₹">INR (₹)</option><option value="$">USD ($)</option></select></div>
        <button id="installApp" style="display:none; width:100%; padding:16px; border-radius:16px; border:none; background:var(--primary); color:#fff; font-weight:700; margin-top:10px; cursor:pointer;">Install App to Home Screen</button>
        <button onclick="logout()" style="width:100%; padding:16px; border-radius:16px; border:none; background:rgba(244, 63, 94, 0.1); color:var(--expense); font-weight:700; margin-top:20px; cursor:pointer; border: 1px solid rgba(244,63,94,0.2);">Logout Account</button>
    </div>

    <!-- PROFILE PAGE -->
    <div id="profile" class="page">
        <header class="header"><h1>My Profile</h1></header>
        <div style="text-align: center; margin-bottom: 25px;">
            <div id="pfpIcon" style="width: 80px; height: 80px; background: linear-gradient(135deg, #6366f1, #ec4899); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 800; color:#fff; box-shadow: 0 10px 25px rgba(99,102,241,0.4);">U</div>
            <h2 id="profileName" style="margin-top: 12px; font-size: 20px;">User</h2>
            <p id="rankLabel" style="color: #818cf8; font-weight: 700; font-size: 13px; margin-top: 4px; letter-spacing: 1px;">BRONZE RANK</p>
        </div>
        <div class="setting-card"><span>Total Transactions</span><h4 id="statCount">0</h4></div>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 16px; font-size: 20px; font-weight: 800;">New Entry</h2>
            <div class="type-toggle">
                <button id="exBtn" class="type-btn active-ex" onclick="setType('expense')">Expense</button>
                <button id="inBtn" class="type-btn" onclick="setType('income')">Income</button>
            </div>
            
            <div style="margin-bottom: 16px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Amount</label>
                <input type="number" id="amtInp" style="width:100%; background:transparent; border:none; border-bottom:2px solid var(--primary); color:#fff; font-size:40px; text-align:center; outline:none; padding: 6px; font-weight:800;" placeholder="0">
            </div>

            <div id="categoryContainer">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Select Category</label>
                <div class="cat-grid" id="catBox">
                    <div class="cat-btn selected" onclick="selCat(this, '🍕', 'Food')">🍕<br>Food</div>
                    <div class="cat-btn" onclick="selCat(this, '🚗', 'Travel')">🚗<br>Travel</div>
                    <div class="cat-btn" onclick="selCat(this, '🛍️', 'Shop')">🛍️<br>Shop</div>
                    <div class="cat-btn" onclick="selCat(this, '💡', 'Bills')">💡<br>Bills</div>
                    <div class="cat-btn" onclick="selCat(this, '🎬', 'Fun')">🎬<br>Fun</div>
                    <div class="cat-btn" onclick="selCat(this, '📦', 'Other')">📦<br>Other</div>
                </div>
            </div>

            <div class="custom-input-box">
                <label>Or type custom name (e.g. Chai, Salary, Book)</label>
                <input type="text" id="customCatInp" placeholder="Type custom name here...">
            </div>

            <button onclick="save()" style="width:100%; padding:16px; background:linear-gradient(135deg, #6366f1, #ec4899); border:none; border-radius:16px; color:#fff; font-weight:700; margin-top:20px; cursor:pointer; box-shadow: 0 10px 25px rgba(99,102,241,0.4); font-size: 15px;">Confirm Entry</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--text-dim); margin-top:10px; padding: 10px; cursor:pointer; font-weight:700; font-size:13px;">Cancel</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showPage('home', this)"><span>🏠</span>Home</button>
        <button class="nav-item" onclick="showPage('reports', this)"><span>📈</span>Stats</button>
        <button class="add-btn" onclick="openModal()">+</button>
        <button class="nav-item" onclick="showPage('settings', this)"><span>⚙️</span>Set</button>
        <button class="nav-item" onclick="showPage('profile', this)"><span>👤</span>Me</button>
    </nav>

    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installApp').style.display = 'block';
        });

        document.getElementById('installApp').addEventListener('click', () => {
            if(deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
        });

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        const firebaseConfig = {
            apiKey: "AIzaSyAuAk4SC_u75__SMqKu50r5bVdga8xcSZY",
            authDomain: "expensespro.firebaseapp.com",
            projectId: "expensespro",
            storageBucket: "expensespro.firebasestorage.app",
            messagingSenderId: "117225436411",
            appId: "1:117225436411:web:db2359d4c642ceec46ac5e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();

        let balance = 0, count = 0, userPath = "", type = 'expense', icon = '🍕', catName = 'Food', editKey = null, currency = '₹', myChart = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                userPath = 'users/' + user.uid;
                const name = user.displayName || "User";
                document.getElementById('userDisp').innerText = name + "!";
                document.getElementById('profileName').innerText = name;
                document.getElementById('pfpIcon').innerText = name.charAt(0).toUpperCase();
                loadData();
            } else { window.location.href = "index.html"; }
        });

        function loadData() {
            db.ref(userPath).on('value', (snap) => {
                const data = snap.val() || {};
                balance = data.balance || 0; count = data.count || 0; currency = data.currency || '₹';
                document.getElementById('currSel').value = currency;
                document.getElementById('mainBal').innerText = currency + balance.toLocaleString();
                document.getElementById('statCount').innerText = count;
                document.getElementById('rankLabel').innerText = count > 20 ? "GOLD RANK" : count > 10 ? "SILVER RANK" : "BRONZE RANK";
                processReports(data.history);
                renderHistory(data.history);
            });
        }

        function processReports(history) {
            let tin = 0, tex = 0;
            if(history) { Object.values(history).forEach(t => { if(t.type === 'income') tin += t.amt; else tex += t.amt; }); }
            document.getElementById('totIn').innerText = currency + tin.toLocaleString();
            document.getElementById('totEx').innerText = currency + tex.toLocaleString();
            updateChart(tin, tex);
        }

        function updateChart(tin, tex) {
            const ctx = document.getElementById('statChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Income', 'Expense'], datasets: [{ data: [tin, tex], backgroundColor: ['#10b981', '#f43f5e'], borderWidth: 0 }] },
                options: { cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: { family: 'Plus Jakarta Sans', size: 12, weight: '600' } } } } }
            });
        }

        function renderHistory(history) {
            const list = document.getElementById('transList'); list.innerHTML = "";
            if(!history) {
                list.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding: 35px; font-size: 14px; font-weight: 600;">No transactions yet.</div>`;
                return;
            }
            Object.entries(history).reverse().forEach(([key, t]) => {
                const item = document.createElement('div');
                item.className = 't-item';
                item.innerHTML = `
                    <div style="display:flex; gap:14px; align-items:center;">
                        <div class="t-icon">${t.type==='income'?'💰':t.icon}</div>
                        <div><h4 style="font-size:15px; font-weight:700; color:#f8fafc;">${t.cat}</h4><small style="color:var(--text-dim); font-size:12px; font-weight:500;">${t.date}</small></div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div style="font-weight:800; font-size:15px; color:${t.type==='income'?'var(--income)':'var(--expense)'}">${t.type==='income'?'+':'-'}${currency}${t.amt.toLocaleString()}</div>
                        <div class="action-btns">
                            <button onclick="editEntry('${key}', ${t.amt}, '${t.type}', '${t.cat}', '${t.icon}')">✏️</button>
                            <button onclick="deleteEntry('${key}', ${t.amt}, '${t.type}')">🗑️</button>
                        </div>
                    </div>`;
                list.appendChild(item);
            });
        }

        function save() {
            const amt = parseFloat(document.getElementById('amtInp').value);
            const customText = document.getElementById('customCatInp').value.trim();

            if(!amt || isNaN(amt)) {
                alert("Please enter a valid amount.");
                return;
            }

            let finalCat = customText !== "" ? customText : catName;

            if(editKey) {
                db.ref(userPath + '/history/' + editKey).once('value', (s) => {
                    const old = s.val();
                    const tempBal = balance + (old.type === 'income' ? -old.amt : old.amt);
                    db.ref(userPath).update({ balance: tempBal + (type === 'income' ? amt : -amt) });
                    db.ref(userPath + '/history/' + editKey).update({ amt, type, cat: finalCat, icon });
                });
            } else {
                db.ref(userPath).update({ balance: balance + (type === 'income' ? amt : -amt), count: count + 1 });
                db.ref(userPath + '/history').push({ amt, type, cat: finalCat, icon, date: new Date().toLocaleDateString('en-IN') });
            }
            closeModal();
        }

        function deleteEntry(key, amt, eType) {
            if(!confirm("Are you sure you want to delete this entry?")) return;
            db.ref(userPath).update({ balance: balance + (eType === 'income' ? -amt : amt), count: count - 1 });
            db.ref(userPath + '/history/' + key).remove();
        }

        function editEntry(key, amt, t, cat, ic) {
            editKey = key; 
            document.getElementById('modalTitle').innerText = "Edit Entry";
            document.getElementById('amtInp').value = amt; 
            setType(t);
            icon = ic; 
            catName = cat; 
            document.getElementById('customCatInp').value = cat;
            openModal();
        }

        function updateCurrency() { db.ref(userPath).update({ currency: document.getElementById('currSel').value }); }
        
        function showPage(id, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
        }

        function setType(t) {
            type = t;
            document.getElementById('inBtn').classList.toggle('active-in', t === 'income');
            document.getElementById('exBtn').classList.toggle('active-ex', t === 'expense');
            document.getElementById('categoryContainer').style.display = (t === 'income' ? 'none' : 'block');
            if(t === 'income') { catName = "Income"; icon = "💰"; }
        }

        function openModal() { document.getElementById('addModal').classList.add('open'); }
        function closeModal() { 
            document.getElementById('addModal').classList.remove('open'); 
            editKey = null; 
            document.getElementById('amtInp').value = ""; 
            document.getElementById('customCatInp').value = "";
            document.getElementById('modalTitle').innerText = "New Entry"; 
        }

        function selCat(el, i, n) { 
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected')); 
            el.classList.add('selected'); 
            icon = i; 
            catName = n; 
            document.getElementById('customCatInp').value = ""; 
        }

        function logout() { auth.signOut(); }
        
        const h = new Date().getHours();
        document.getElementById('greet').innerText = h < 12 ? "Good Morning," : h < 17 ? "Good Afternoon," : "Good Evening,";
    </script>
</body>
</html>
