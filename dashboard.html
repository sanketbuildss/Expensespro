<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExpensePro | Dashboard</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root { --bg: #050509; --surface: #0f1017; --primary: #6366f1; --income: #10b981; --expense: #ef4444; --text-main: #f8fafc; --text-dim: #94a3b8; --border: rgba(255, 255, 255, 0.06); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); padding-bottom: 110px; min-height: 100vh; overflow-x: hidden; }
        
        .page { display: none; padding: 25px 18px; animation: fadeIn 0.3s ease; max-width: 500px; margin: 0 auto; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

        .header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 24px; font-weight: 800; color: #fff; }
        
        .balance-card { background: linear-gradient(135deg, #131520, #0a0b10); padding: 25px; border-radius: 24px; border: 1px solid var(--border); text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .balance-card span { color: var(--text-dim); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .balance-card h2 { font-size: 34px; font-weight: 800; margin-top: 5px; color: #fff; }

        .section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; color: #cbd5e1; }
        
        .t-item { background: var(--surface); padding: 15px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid var(--border); transition: 0.2s; }
        .t-item:hover { background: #141622; }
        .t-icon { width: 42px; height: 42px; background: rgba(255,255,255,0.03); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        
        .action-btns { display: flex; gap: 6px; margin-left: 8px; }
        .action-btns button { background: rgba(255,255,255,0.05); border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .action-btns button:hover { background: rgba(255,255,255,0.12); }

        /* Modal / Bottom Sheet Style */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: flex-end; z-index: 1000; }
        .modal-content { background: #0b0c13; width: 100%; max-width: 480px; padding: 25px; border-radius: 30px 30px 0 0; border: 1px solid var(--border); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); max-height: 85vh; overflow-y: auto; }
        .modal-overlay.open { display: flex; }
        .modal-overlay.open .modal-content { transform: translateY(0); }
        
        .type-toggle { display: flex; gap: 6px; margin-bottom: 18px; background: rgba(255,255,255,0.03); padding: 4px; border-radius: 12px; }
        .type-btn { flex: 1; padding: 10px; border: none; border-radius: 10px; cursor: pointer; color: var(--text-dim); font-weight: 700; font-size: 13px; background: transparent; transition: 0.2s; }
        .type-btn.active-ex { background: var(--expense); color: #fff; }
        .type-btn.active-in { background: var(--income); color: #fff; }

        .cat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
        .cat-btn { background: rgba(255,255,255,0.02); padding: 10px 6px; border-radius: 12px; color: var(--text-dim); cursor: pointer; text-align: center; border: 1.5px solid transparent; font-size: 12px; font-weight: 500; transition: 0.2s; }
        .cat-btn.selected { background: rgba(99, 102, 241, 0.15); border-color: var(--primary); color: #fff; font-weight: 700; }

        .custom-input-box { margin-top: 12px; }
        .custom-input-box label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 5px; font-weight: 600; }
        .custom-input-box input { width: 100%; padding: 12px 14px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 12px; color: #fff; font-size: 14px; outline: none; }
        .custom-input-box input:focus { border-color: var(--primary); }

        .setting-card { background: var(--surface); padding: 16px 18px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid var(--border); font-size: 14px; }
        select { background: #141622; color: #fff; border: 1px solid var(--border); padding: 6px 10px; border-radius: 8px; outline: none; font-weight: 600; }

        /* Sleek Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: rgba(11, 12, 19, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 8px; border-radius: 24px; border: 1px solid var(--border); z-index: 500; box-shadow: 0 15px 25px rgba(0,0,0,0.5); }
        .nav-item { color: var(--text-dim); border: none; background: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 10px; font-weight: 600; }
        .nav-item.active { color: var(--primary); }
        .nav-item span { font-size: 16px; margin-bottom: 1px; }
        .add-btn { width: 50px; height: 50px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 50%; color: #fff; font-size: 24px; border: none; transform: translateY(-18px); box-shadow: 0 8px 20px rgba(99,102,241,0.4); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <!-- HOME PAGE -->
    <div id="home" class="page active">
        <header class="header">
            <div><p id="greet" style="color:var(--text-dim); font-size:12px; font-weight:600;">Hello,</p><h1 id="userDisp">User!</h1></div>
        </header>
        <div class="balance-card">
            <span>Available Balance</span>
            <h2 id="mainBal">₹0</h2>
        </div>
        <div class="section-title">Recent History</div>
        <div id="transList"></div>
    </div>

    <!-- REPORTS PAGE -->
    <div id="reports" class="page">
        <header class="header"><h1>Analytics</h1></header>
        <div class="balance-card" style="padding: 18px;"><canvas id="statChart"></canvas></div>
        <div class="setting-card"><span>Total Income</span><h4 id="totIn" style="color:var(--income)">₹0</h4></div>
        <div class="setting-card"><span>Total Expense</span><h4 id="totEx" style="color:var(--expense)">₹0</h4></div>
    </div>

    <!-- SETTINGS PAGE -->
    <div id="settings" class="page">
        <header class="header"><h1>Settings</h1></header>
        <div class="setting-card"><span>Currency</span><select id="currSel" onchange="updateCurrency()"><option value="₹">INR (₹)</option><option value="$">USD ($)</option></select></div>
        <button id="installApp" style="display:none; width:100%; padding:14px; border-radius:14px; border:none; background:var(--primary); color:#fff; font-weight:700; margin-top:8px; cursor:pointer;">Install App</button>
        <button onclick="logout()" style="width:100%; padding:14px; border-radius:14px; border:none; background:rgba(239, 68, 68, 0.1); color:var(--expense); font-weight:700; margin-top:15px; cursor:pointer;">Logout</button>
    </div>

    <!-- PROFILE PAGE -->
    <div id="profile" class="page">
        <header class="header"><h1>Profile</h1></header>
        <div style="text-align: center; margin-bottom: 20px;">
            <div id="pfpIcon" style="width: 70px; height: 70px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color:#fff;">U</div>
            <h2 id="profileName" style="margin-top: 10px; font-size: 18px;">User</h2>
            <p id="rankLabel" style="color: #818cf8; font-weight: 700; font-size: 12px; margin-top: 2px;">BRONZE RANK</p>
        </div>
        <div class="setting-card"><span>Total Transactions</span><h4 id="statCount">0</h4></div>
    </div>

    <!-- ADD / EDIT MODAL -->
    <div id="addModal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin-bottom: 14px; font-size: 18px;">New Entry</h2>
            <div class="type-toggle">
                <button id="exBtn" class="type-btn active-ex" onclick="setType('expense')">Expense</button>
                <button id="inBtn" class="type-btn" onclick="setType('income')">Income</button>
            </div>
            
            <div style="margin-bottom: 12px;">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600;">AMOUNT</label>
                <input type="number" id="amtInp" style="width:100%; background:transparent; border:none; border-bottom:2px solid var(--primary); color:#fff; font-size:32px; text-align:center; outline:none; padding: 4px;" placeholder="0">
            </div>

            <div id="categoryContainer">
                <label style="font-size: 11px; color: var(--text-dim); font-weight: 600;">CATEGORY</label>
                <div class="cat-grid" id="catBox">
                    <div class="cat-btn selected" onclick="selCat(this, '🍕', 'Food')">🍕<br>Food</div>
                    <div class="cat-btn" onclick="selCat(this, '🚗', 'Travel')">🚗<br>Travel</div>
                    <div class="cat-btn" onclick="selCat(this, '🛍️', 'Shop')">🛍️<br>Shop</div>
                    <div class="cat-btn" onclick="selCat(this, '💡', 'Bills')">💡<br>Bills</div>
                    <div class="cat-btn" onclick="selCat(this, '🎬', 'Fun')">🎬<br>Fun</div>
                    <div class="cat-btn" onclick="selCat(this, '📦', 'Other')">📦<br>Other</div>
                </div>
            </div>

            <div class="custom-input-box">
                <label>Or type custom name (e.g., Chai, Book, Salary):</label>
                <input type="text" id="customCatInp" placeholder="Type custom name here...">
            </div>

            <button onclick="save()" style="width:100%; padding:14px; background:linear-gradient(135deg, #6366f1, #a855f7); border:none; border-radius:14px; color:#fff; font-weight:700; margin-top:16px; cursor:pointer;">Confirm</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:var(--text-dim); margin-top:8px; padding: 8px; cursor:pointer; font-weight:600; font-size:13px;">Cancel</button>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="showPage('home', this)"><span>🏠</span>Home</button>
        <button class="nav-item" onclick="showPage('reports', this)"><span>📈</span>Stats</button>
        <button class="add-btn" onclick="openModal()">+</button>
        <button class="nav-item" onclick="showPage('settings', this)"><span>⚙️</span>Set</button>
        <button class="nav-item" onclick="showPage('profile', this)"><span>👤</span>Me</button>
    </nav>

    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installApp').style.display = 'block';
        });

        document.getElementById('installApp').addEventListener('click', () => {
            if(deferredPrompt) { deferredPrompt.prompt(); deferredPrompt = null; }
        });

        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        const firebaseConfig = {
            apiKey: "AIzaSyAuAk4SC_u75__SMqKu50r5bVdga8xcSZY",
            authDomain: "expensespro.firebaseapp.com",
            projectId: "expensespro",
            storageBucket: "expensespro.firebasestorage.app",
            messagingSenderId: "117225436411",
            appId: "1:117225436411:web:db2359d4c642ceec46ac5e"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database(), auth = firebase.auth();

        let balance = 0, count = 0, userPath = "", type = 'expense', icon = '🍕', catName = 'Food', editKey = null, currency = '₹', myChart = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                userPath = 'users/' + user.uid;
                const name = user.displayName || "User";
                document.getElementById('userDisp').innerText = name + "!";
                document.getElementById('profileName').innerText = name;
                document.getElementById('pfpIcon').innerText = name.charAt(0).toUpperCase();
                loadData();
            } else { window.location.href = "index.html"; }
        });

        function loadData() {
            db.ref(userPath).on('value', (snap) => {
                const data = snap.val() || {};
                balance = data.balance || 0; count = data.count || 0; currency = data.currency || '₹';
                document.getElementById('currSel').value = currency;
                document.getElementById('mainBal').innerText = currency + balance.toLocaleString();
                document.getElementById('statCount').innerText = count;
                document.getElementById('rankLabel').innerText = count > 20 ? "GOLD RANK" : count > 10 ? "SILVER RANK" : "BRONZE RANK";
                processReports(data.history);
                renderHistory(data.history);
            });
        }

        function processReports(history) {
            let tin = 0, tex = 0;
            if(history) { Object.values(history).forEach(t => { if(t.type === 'income') tin += t.amt; else tex += t.amt; }); }
            document.getElementById('totIn').innerText = currency + tin.toLocaleString();
            document.getElementById('totEx').innerText = currency + tex.toLocaleString();
            updateChart(tin, tex);
        }

        function updateChart(tin, tex) {
            const ctx = document.getElementById('statChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['Income', 'Expense'], datasets: [{ data: [tin, tex], backgroundColor: ['#10b981', '#ef4444'], borderWidth: 0 }] },
                options: { cutout: '75%', plugins: { legend: { position: 'bottom', labels: { color: '#fff', font: { family: 'Plus Jakarta Sans', size: 11 } } } } }
            });
        }

        function renderHistory(history) {
            const list = document.getElementById('transList'); list.innerHTML = "";
            if(!history) {
                list.innerHTML = `<div style="text-align:center; color:var(--text-dim); padding: 25px; font-size: 13px;">No transactions yet.</div>`;
                return;
            }
            Object.entries(history).reverse().forEach(([key, t]) => {
                const item = document.createElement('div');
                item.className = 't-item';
                item.innerHTML = `
                    <div style="display:flex; gap:12px; align-items:center;">
                        <div class="t-icon">${t.type==='income'?'💰':t.icon}</div>
                        <div><h4 style="font-size:14px; font-weight:700;">${t.cat}</h4><small style="color:var(--text-dim); font-size:11px;">${t.date}</small></div>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <div style="font-weight:800; font-size:14px; color:${t.type==='income'?'var(--income)':'var(--expense)'}">${t.type==='income'?'+':'-'}${currency}${t.amt.toLocaleString()}</div>
                        <div class="action-btns">
                            <button onclick="editEntry('${key}', ${t.amt}, '${t.type}', '${t.cat}', '${t.icon}')">✏️</button>
                            <button onclick="deleteEntry('${key}', ${t.amt}, '${t.type}')">🗑️</button>
                        </div>
                    </div>`;
                list.appendChild(item);
            });
        }

        function save() {
            const amt = parseFloat(document.getElementById('amtInp').value);
            const customText = document.getElementById('customCatInp').value.trim();

            if(!amt || isNaN(amt)) {
                alert("Please enter a valid amount.");
                return;
            }

            let finalCat = customText !== "" ? customText : catName;

            if(editKey) {
                db.ref(userPath + '/history/' + editKey).once('value', (s) => {
                    const old = s.val();
                    const tempBal = balance + (old.type === 'income' ? -old.amt : old.amt);
                    db.ref(userPath).update({ balance: tempBal + (type === 'income' ? amt : -amt) });
                    db.ref(userPath + '/history/' + editKey).update({ amt, type, cat: finalCat, icon });
                });
            } else {
                db.ref(userPath).update({ balance: balance + (type === 'income' ? amt : -amt), count: count + 1 });
                db.ref(userPath + '/history').push({ amt, type, cat: finalCat, icon, date: new Date().toLocaleDateString('en-IN') });
            }
            closeModal();
        }

        function deleteEntry(key, amt, eType) {
            if(!confirm("Are you sure you want to delete this entry?")) return;
            db.ref(userPath).update({ balance: balance + (eType === 'income' ? -amt : amt), count: count - 1 });
            db.ref(userPath + '/history/' + key).remove();
        }

        function editEntry(key, amt, t, cat, ic) {
            editKey = key; 
            document.getElementById('modalTitle').innerText = "Edit Entry";
            document.getElementById('amtInp').value = amt; 
            setType(t);
            icon = ic; 
            catName = cat; 
            document.getElementById('customCatInp').value = cat;
            openModal();
        }

        function updateCurrency() { db.ref(userPath).update({ currency: document.getElementById('currSel').value }); }
        
        function showPage(id, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            btn.classList.add('active');
        }

        function setType(t) {
            type = t;
            document.getElementById('inBtn').classList.toggle('active-in', t === 'income');
            document.getElementById('exBtn').classList.toggle('active-ex', t === 'expense');
            document.getElementById('categoryContainer').style.display = (t === 'income' ? 'none' : 'block');
            if(t === 'income') { catName = "Income"; icon = "💰"; }
        }

        function openModal() { document.getElementById('addModal').classList.add('open'); }
        function closeModal() { 
            document.getElementById('addModal').classList.remove('open'); 
            editKey = null; 
            document.getElementById('amtInp').value = ""; 
            document.getElementById('customCatInp').value = "";
            document.getElementById('modalTitle').innerText = "New Entry"; 
        }

        function selCat(el, i, n) { 
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('selected')); 
            el.classList.add('selected'); 
            icon = i; 
            catName = n; 
            document.getElementById('customCatInp').value = ""; 
        }

        function logout() { auth.signOut(); }
        
        const h = new Date().getHours();
        document.getElementById('greet').innerText = h < 12 ? "Good Morning," : h < 17 ? "Good Afternoon," : "Good Evening,";
    </script>
</body>
</html>
